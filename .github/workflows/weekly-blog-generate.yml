name: Weekly Blog Article Generation

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  NODE_ENV: production

jobs:
  generate-article:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate new blog article
        run: node scripts/generate-blog-article.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLE_TOPICS: "cold email templates that convert|stats B2B cold outreach|UX improvements for SaaS landing pages|email personalization techniques|cro best practices 2026"
          ARTICLE_CATEGORY: "cold-outreach"
          ARTICLE_LENGTH: "medium"

      - name: Check changes
        id: check_changes
        run: |
          if git diff --exit-code content/blog/articles.json content/blog/articles/; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'feat(blog): add AI-generated article'
          branch: 'blog/auto-generated-$(date +%Y%m%d)'
          delete-branch: true
          title: 'Blog: Nouvel article généré automatiquement'
          body: |
            Un nouvel article de blog a été généré automatiquement par Claude AI.

            ## Checklist
            - [ ] Vérifier la qualité du contenu
            - [ ] Vérifier les liens et images
            - [ ] Ajuster le titre SEO si nécessaire
            - [ ] Merger si tout est correct
          labels: blog, automated

      - name: Notify on failure
        if: failure()
        run: |
          echo "La génération de l'article a échoué. Vérifiez les logs."