global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    scrape_interval: 15s
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'screencold-web'
    scrape_interval: 15s
    static_configs:
      - targets: ['web:3000']
    metrics_path: '/api/metrics'

  - job_name: 'screencold-worker'
    scrape_interval: 15s
    static_configs:
      - targets: ['worker:3001']
    metrics_path: '/metrics'
